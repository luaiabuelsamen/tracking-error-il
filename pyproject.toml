[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tracking-error-il"
version = "0.1.0"
description = "Tracking error as an observation for behavior cloning on the SO-101 arm: simulation benchmark, hardware evaluation pipeline, and paper evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.0",
    "numpy>=1.24",
]

license = {text = "Apache-2.0"}
authors = [{name = "Luai Abuelsamen", email = "luai_abuelsamen@berkeley.edu"}]
keywords = ["behavior cloning", "imitation learning", "manipulation", "SO-101", "MuJoCo"]

[project.urls]
Repository = "https://github.com/luaiabuelsamen/tracking-error-il"

[project.optional-dependencies]
data = ["lerobot>=0.3", "pandas>=2.0", "pyarrow>=14"]
video = ["imageio[ffmpeg]>=2.30"]
analysis = ["scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0", "pyarrow>=14", "pillow>=10"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracking_error_il = ["assets/*.xml", "assets/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Experiment scripts: long literal tables, and interpreter re-exec or sys.path
# setup that must run before the imports that depend on it.
"scripts/**" = ["E501", "E402"]
"tests/test_real_pipeline.py" = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: excluded from `make test-fast`"]
